name: Probe - variable output propagation

# Temporary diagnostic. Confirms that a matrix job output built from a
# repository variable reaches a downstream job intact.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dockerhub-username-variable

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    outputs:
      image_tags: ${{ steps.tags.outputs.image_tags }}
      image_ref: ${{ steps.tags.outputs.image_ref }}
    steps:
      - name: Generate tags
        id: tags
        env:
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "image_tags=ghcr.io/${{ github.repository_owner }}/n8n:nightly-${DOCKER_USERNAME}-${{ matrix.arch }},${DOCKER_USERNAME}/n8n:nightly-${DOCKER_USERNAME}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/${{ github.repository_owner }}/n8n:nightly-${DOCKER_USERNAME}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

  consume:
    name: Consume
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Read outputs
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          echo "IMAGE_TAGS=$IMAGE_TAGS"
          echo "IMAGE_REF=$IMAGE_REF"
          if [ -z "$IMAGE_REF" ]; then
            echo "RESULT=EMPTY"
            exit 1
          fi
          echo "RESULT=OK"
